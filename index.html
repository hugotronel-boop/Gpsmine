<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS Minecraft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--stone:#c6c6c6;--hi:#fff;--lo:#555;--ink:#3f3f3f;--slot:#8b8b8b;--gold:#ffff55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:#3b2a1b radial-gradient(#4a3422 2px,transparent 2px) 0 0/16px 16px;
font-family:'Press Start 2P','Courier New',monospace;font-size:10px;line-height:1.7;color:var(--ink)}
main{max-width:520px;margin:0 auto;padding:18px 14px 28px;display:grid;gap:18px}
.gui{background:var(--stone);border:4px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);outline:4px solid #000;padding:10px;min-width:0}
.well{background:var(--slot);border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.mapbox{position:relative;padding:0}
#map{display:block;width:100%;height:320px;image-rendering:pixelated}
#hud{position:absolute;left:8px;top:8px;color:#fff;font-size:8px;line-height:1.9;text-shadow:2px 2px #000;pointer-events:none;white-space:pre}
.zoom{position:absolute;right:8px;top:8px;display:grid;gap:6px}
.dpad{position:absolute;left:8px;bottom:8px;display:none;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,38px);gap:4px}
.dpad.on{display:grid}
.dpad button:nth-child(1){grid-column:2}
.btn{font:inherit;font-size:10px;line-height:1.4;color:#fff;background:#8b8b8b;text-shadow:2px 2px #3f3f3f;
border:3px solid;border-color:#d0d1d4 #373737 #373737 #d0d1d4;outline:2px solid #000;padding:9px 8px;cursor:pointer;touch-action:manipulation}
.btn:hover{background:#7a86c4}
.btn:active{border-color:#373737 #d0d1d4 #d0d1d4 #373737}
.btn:focus-visible,.slot:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sq{padding:0;width:38px;height:38px}
.nav{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
#cmp{width:132px;height:132px;image-rendering:pixelated;display:block}
.nav p{margin:0 0 6px}
.big{font-size:16px;color:#000;line-height:1.4}
.dim{color:#555;font-size:8px}
.hotbar{display:grid;grid-template-columns:repeat(9,1fr);gap:0;background:#8b8b8b;border:4px solid;border-color:#373737 #fff #fff #373737;outline:4px solid #000}
.slot{aspect-ratio:1;border:2px solid #373737;background:#8b8b8b;padding:0;cursor:pointer;position:relative;font:inherit}
.slot.sel{outline:4px solid #fff;outline-offset:-4px;z-index:1;background:#9a9a9a}
.slot i{position:absolute;inset:22%;border:2px solid #000;box-shadow:inset 3px 3px #fff6,inset -3px -3px #0004}
.slot b{position:absolute;right:3px;bottom:1px;font-size:8px;color:#fff;text-shadow:1px 1px #000}
form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:8px}
input{font:inherit;font-size:10px;width:100%;padding:8px 6px;color:#fff;background:#000;border:3px solid;border-color:#373737 #fff #fff #373737}
input::placeholder{color:#888}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts .btn{flex:1 1 auto}
#msg{margin:0;min-height:3.4em;font-size:8px;color:#222}
.btn.on{background:#4f8a34;border-color:#8fd06a #2a4d1a #2a4d1a #8fd06a}
#steps{list-style:none;margin:10px 0 0;padding:0;max-height:190px;overflow:auto;font-size:8px;line-height:1.6}
#steps:empty{display:none}
#steps li{display:grid;grid-template-columns:18px 1fr auto;gap:6px;padding:6px;border-bottom:2px solid #6f6f6f;color:#fff;text-shadow:1px 1px #000}
#steps li.cur{background:#4f8a34}
#steps b{font-weight:400;color:#ffd83a}
#map{touch-action:none;cursor:grab}#map:active{cursor:grabbing}
.rc{position:absolute;right:8px;bottom:8px;display:none}.rc.on{display:block}
body.fs .rc{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#toast{position:absolute;left:8px;right:60px;top:100px;color:#fff;font-size:8px;line-height:1.7;text-shadow:2px 2px #000;pointer-events:none}
body.fs{overflow:hidden}
body.fs .mapbox{position:fixed;inset:0;z-index:50;margin:0;border:0;outline:0}
body.fs #map{height:100vh;height:100dvh}
body.fs .zoom,body.fs #hud{top:calc(8px + env(safe-area-inset-top,0px))}
body.fs .nav{position:fixed;z-index:60;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:150px;height:150px;padding:6px;gap:4px;display:flex;flex-direction:column;align-items:center}
body.fs .nav>div:last-child{text-align:center;width:100%}
body.fs .nav .well{line-height:0}
body.fs #tname,body.fs #tdir{display:none}
body.fs .big{font-size:10px;line-height:1.3}
body.fs #teta{font-size:8px;margin:0}
body.fs #cmp{width:84px;height:84px;margin:0}
body.fs .nav p{margin:0 0 3px}
body.fs .dpad{bottom:calc(172px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){body{font-size:9px}.nav{grid-template-columns:1fr}#cmp{margin:0 auto}}
</style>
</head>
<body>
<main>
 <section class="gui mapbox" aria-label="Carte">
  <canvas id="map" height="320"></canvas>
  <div id="hud" aria-live="off">Recherche du signal GPS…</div>
  <div id="toast" aria-live="polite"></div>
  <div class="zoom">
   <button class="btn sq" id="fsb" aria-label="Plein écran">▣</button>
   <button class="btn sq" id="zi" aria-label="Zoom avant">+</button>
   <button class="btn sq" id="zo" aria-label="Zoom arrière">-</button>
   <button class="btn sq" id="bp" aria-label="Poser une balise au centre de la carte" title="Poser une balise">★</button>
  </div>
  <button class="btn rc" id="rc" type="button">Recentrer</button>
  <div class="dpad" id="dpad" aria-label="Déplacement en mode démo">
   <button class="btn sq" data-k="u" aria-label="Haut">▲</button>
   <button class="btn sq" data-k="l" aria-label="Gauche">◀</button>
   <button class="btn sq" data-k="d" aria-label="Bas">▼</button>
   <button class="btn sq" data-k="r" aria-label="Droite">▶</button>
  </div>
 </section>

 <section class="gui nav" aria-label="Navigation">
  <div class="well"><canvas id="cmp" width="24" height="24"></canvas></div>
  <div>
   <p class="dim" id="tname">Aucune cible</p>
   <p class="big" id="tdist">--</p>
   <p id="tdir" class="dim">Pose une balise pour guider la boussole.</p>
   <p id="teta" class="dim"></p>
  </div>
 </section>

 <section class="gui" aria-label="Itinéraire">
  <form id="rf" autocomplete="off">
   <label>Destination<input id="rd" placeholder="Adresse, lieu ou lat, lon (vide = balise choisie)"></label>
   <div class="acts" id="modes">
    <button class="btn on" type="button" data-m="foot">À pied</button>
    <button class="btn" type="button" data-m="bike">Vélo</button>
    <button class="btn" type="button" data-m="car">Voiture</button>
   </div>
   <div class="acts">
    <button class="btn" type="submit">Calculer le trajet</button>
    <button class="btn" type="button" id="rStop">Annuler</button>
   </div>
  </form>
  <ol id="steps" class="well" aria-label="Feuille de route"></ol>
 </section>

 <div class="hotbar" id="bar" role="group" aria-label="Balises"></div>

 <section class="gui">
  <form id="f" autocomplete="off">
   <label>Nom de la balise<input id="n" maxlength="14" placeholder="Maison"></label>
   <label>Adresse (optionnel)<input id="ad" placeholder="12 rue de Rivoli, Paris"></label>
   <div class="row">
    <label>Latitude<input id="la" inputmode="decimal" placeholder="position actuelle"></label>
    <label>Longitude<input id="lo" inputmode="decimal" placeholder="position actuelle"></label>
   </div>
   <div class="acts">
    <button class="btn" type="submit">Poser la balise</button>
    <button class="btn" type="button" id="bDel">Détruire</button>
   </div>
   <div class="acts">
    <button class="btn" type="button" id="bLoc">Me localiser</button>
    <button class="btn" type="button" id="bCmp">Boussole</button>
    <button class="btn" type="button" id="bDemo">Mode démo</button>
   </div>
   <p id="msg" role="status">1 bloc = 1 mètre. Laisse latitude et longitude vides pour poser une balise ici.</p>
  </form>
 </section>
</main>

<script>
const $=s=>document.querySelector(s),R=Math.PI/180;
const PPM=[.5,1,2,4,8],TM=8,COL=['#e04040','#e0a030','#40c050','#30b0e0','#7060e0','#d050c0','#f0f0f0','#a0e030','#e07830'];
const CARD=['N','NE','E','SE','S','SO','O','NO'];
const K=(x,z)=>(x+8388608)*16777216+(z+8388608);
let P=null,ref=null,heading=0,hasCmp=false,demo=false,watch=null,wps=[],sel=0,trail=[],zi=2,keys={u:0,d:0,l:0,r:0};
let seeded=false,dseeded=false;
try{const raw=localStorage.getItem('mcgps');seeded=raw!==null;wps=JSON.parse(raw||'[]')}catch(e){wps=[]}
const save=()=>{try{localStorage.setItem('mcgps',JSON.stringify(wps.filter(w=>!w.demo)))}catch(e){}};
const msg=t=>$('#msg').textContent=t;
const cv=$('#map'),ctx=cv.getContext('2d');

/* --- maths géo --- */
const dist=(a,b,c,d)=>{const p=(c-a)*R,q=(d-b)*R,h=Math.sin(p/2)**2+Math.cos(a*R)*Math.cos(c*R)*Math.sin(q/2)**2;return 12742000*Math.asin(Math.sqrt(h))};
const bear=(a,b,c,d)=>{const q=(d-b)*R;return(Math.atan2(Math.sin(q)*Math.cos(c*R),Math.cos(a*R)*Math.sin(c*R)-Math.sin(a*R)*Math.cos(c*R)*Math.cos(q))/R+360)%360};
const abs=(la,lo)=>[(lo-ref.lon)*111320*Math.cos(ref.lat*R),-(la-ref.lat)*110574];
const card=d=>CARD[Math.round(d/45)%8];
const fmt=d=>d<1000?Math.round(d)+' blocs':(d/1000).toFixed(2)+' km';

/* --- terrain procédural --- */
function hash(x,z){let h=Math.imul(x,374761393)+Math.imul(z,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function vn(x,z,s){const fx=x/s,fz=z/s,ix=Math.floor(fx),iz=Math.floor(fz),tx=fx-ix,tz=fz-iz,
a=hash(ix,iz),b=hash(ix+1,iz),c=hash(ix,iz+1),d=hash(ix+1,iz+1),u=tx*tx*(3-2*tx),v=tz*tz*(3-2*tz);
return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const BIO=[[.36,['#3d6fd0','#4577d8']],[.4,['#d8c98a','#cfc080']],[.78,['#5d9b3a','#69a842']],[.9,['#7a5535','#6f4c2f']],[2,['#8a8a8a','#7c7c7c']]];
function tile(x,z){const j0=hash(x+99,z-7)>.5?1:0;if(real){const o=G.get(K(x,z));if(o)return OSMC[o][j0];return CH.get(Math.floor(x/CT)+','+Math.floor(z/CT))==='ok'?BIO[2][1][j0]:(j0?'#4f6d3a':'#56753f')}const n=vn(x,z,9)*.65+vn(x,z,3)*.35,j=hash(x+99,z-7)>.5?1:0;for(const[t,c]of BIO)if(n<t)return c[j]}

/* --- dessin carte --- */
const STEVE=["HHHHHHHH","HHHHHHHH","HSSSSSSH","SWBSSBWS","SSSnnSSS","SSbbbbSS","SbbbbbbS","SbbbbbbS"],
SC={H:'#3b2a1e',S:'#c68e6a',W:'#fff',B:'#4a3fc9',n:'#a8704f',b:'#5a3a26'};
function draw(){
 const W=cv.width,H=cv.height,x=ctx;x.imageSmoothingEnabled=false;
 if(!P){x.fillStyle='#2b2b2b';x.fillRect(0,0,W,H);return}
 const ppm=PPM[zi],[ux,uz]=abs(P.lat,P.lon),px=ux+pan[0],pz=uz+pan[1],cx=W/2,cy=H/2,pcx=cx+(ux-px)*ppm,pcy=cy+(uz-pz)*ppm,ts=Math.ceil(TM*ppm)+1;
 x.fillStyle='#56753f';x.fillRect(0,0,W,H);terrain(x,px,pz,cx,cy,ppm);
 x.fillStyle='rgba(255,255,255,.6)';
 for(const[tx,tz]of trail)x.fillRect(Math.round(cx+(tx-px)*ppm)-2,Math.round(cy+(tz-pz)*ppm)-2,4,4);
 if(route){x.save();x.lineJoin='round';x.lineCap='round';x.beginPath();
  if(route.rf!==ref){route.ab=route.pts.map(q=>abs(q[0],q[1]));route.rf=ref}
  route.ab.forEach((q,i)=>{const sx=cx+(q[0]-px)*ppm,sy=cy+(q[1]-pz)*ppm;i?x.lineTo(sx,sy):x.moveTo(sx,sy)});
  const lw=Math.max(5,ppm*5);x.strokeStyle='#000';x.lineWidth=lw+4;x.stroke();x.strokeStyle='#ffd83a';x.lineWidth=lw;x.stroke();
  x.setLineDash([6,10]);x.strokeStyle='#fff8c0';x.lineWidth=2;x.stroke();x.restore();
  const[dx,dz]=abs(route.la,route.lo),ex=Math.round(cx+(dx-px)*ppm),ey=Math.round(cy+(dz-pz)*ppm);
  if(ex>8&&ex<W-8&&ey>8&&ey<H-8){x.fillStyle='#ffd83a66';x.fillRect(ex-3,0,6,ey);x.fillStyle='#ffd83a';x.fillRect(ex-8,ey-8,16,16);x.strokeStyle='#000';x.lineWidth=2;x.strokeRect(ex-8,ey-8,16,16);x.fillStyle='#000';x.fillRect(ex-1,ey-5,2,10);x.fillRect(ex-5,ey-1,10,2)}}
 wps.forEach((w,i)=>{
  const[wx,wz]=abs(w.lat,w.lon),sx=Math.round(cx+(wx-px)*ppm),sy=Math.round(cy+(wz-pz)*ppm),on=sx>6&&sx<W-6&&sy>6&&sy<H-6;
  if(i===sel){x.save();x.setLineDash([6,6]);x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(pcx,pcy);x.lineTo(sx,sy);x.stroke();x.restore()}
  if(on){
   x.fillStyle=COL[i%9]+'55';x.fillRect(sx-3,0,6,sy);
   x.fillStyle=COL[i%9];x.fillRect(sx-7,sy-7,14,14);x.strokeStyle=i===sel?'#fff':'#000';x.lineWidth=i===sel?3:2;x.strokeRect(sx-7,sy-7,14,14);
   x.fillStyle='#fff';x.font='8px "Press Start 2P",monospace';x.fillText(w.n.slice(0,10),sx+11,sy+4)}
  else if(i===sel){
   const a=Math.atan2(sy-cy,sx-cx),r=Math.min(cx,cy)-16;x.save();x.translate(cx+Math.cos(a)*r,cy+Math.sin(a)*r);x.rotate(a);
   x.fillStyle=COL[i%9];x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.moveTo(10,0);x.lineTo(-8,-8);x.lineTo(-8,8);x.closePath();x.fill();x.stroke();x.restore()}
 });
 x.save();x.translate(pcx,pcy);x.rotate(heading*R);x.fillStyle='#e03030';x.strokeStyle='#000';x.lineWidth=2;
 x.beginPath();x.moveTo(0,-24);x.lineTo(-7,-13);x.lineTo(7,-13);x.closePath();x.fill();x.stroke();x.restore();
 STEVE.forEach((r,j)=>[...r].forEach((c,i)=>{x.fillStyle=SC[c];x.fillRect(pcx-8+i*2,pcy-8+j*2,2,2)}));
 x.strokeStyle='#000';x.lineWidth=2;x.strokeRect(pcx-8,pcy-8,16,16);
 if(Math.hypot(pan[0],pan[1])>5){x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(cx-9,cy);x.lineTo(cx+9,cy);x.moveTo(cx,cy-9);x.lineTo(cx,cy+9);x.stroke()}
}

/* --- boussole --- */
const cc=$('#cmp').getContext('2d');
function compass(rel){
 cc.clearRect(0,0,24,24);
 for(let y=0;y<24;y++)for(let x=0;x<24;x++){const d=Math.hypot(x-11.5,y-11.5);
  if(d<11.7){cc.fillStyle=d>9.6?((x+y)&1?'#9a9a9a':'#b8b8b8'):'#2e2e2e';cc.fillRect(x,y,1,1)}}
 cc.fillStyle='#fff';[[11,3],[12,3],[11,20],[12,20],[3,11],[3,12],[20,11],[20,12]].forEach(([x,y])=>cc.fillRect(x,y,1,1));
 cc.fillStyle='#e03030';cc.fillRect(11,2,2,1);
 const a=rel*R;
 for(let t=-5;t<=8;t+=.5){cc.fillStyle=t>=0?'#e03030':'#e8e8e8';cc.fillRect(Math.floor(11.5+Math.sin(a)*t),Math.floor(11.5-Math.cos(a)*t),1,1)}
}

/* --- infos --- */
function info(){
 const w=wps[sel];
 if(P){const alt=P.alt!=null?Math.round(P.alt):'--';
  $('#hud').textContent=`Lat ${P.lat.toFixed(5)}\nLon ${P.lon.toFixed(5)}\nAlt ${alt}  ${card(heading)} ${Math.round(heading)}°\n${(P.spd*3.6).toFixed(1)} km/h${demo?'  DEMO':'  ±'+Math.round(P.acc)+' m'}\n${ld?'Chargement…':place}`}
 if(P&&route){navRoute();return}
 if(!P||!w){compass(-heading);$('#tname').textContent='Aucune cible';$('#tdist').textContent=P?card(heading)+' '+Math.round(heading)+'°':'--';
  $('#tdir').textContent=P?'Pose une balise pour guider la boussole.':'En attente de position…';$('#teta').textContent='';return}
 const d=dist(P.lat,P.lon,w.lat,w.lon),b=bear(P.lat,P.lon,w.lat,w.lon),s=d/1.4;
 compass(b-heading);
 $('#tname').textContent='Cible : '+w.n;
 $('#tdist').textContent=d<6?'Arrivé !':fmt(d);
 $('#tdir').textContent=d<6?'Tu es sur la balise.':`Direction ${card(b)} ${Math.round(b)}°`;
 $('#teta').textContent=d<6?'':(document.body.classList.contains('fs')?'':'À pied : ')+dur(s);
}
function bar(){
 const el=$('#bar');el.innerHTML='';
 for(let i=0;i<9;i++){const w=wps[i],b=document.createElement('button');b.type='button';b.className='slot'+(i===sel&&w?' sel':'');
  b.setAttribute('aria-label',w?`Balise ${i+1} : ${w.n}`:`Emplacement ${i+1} vide`);
  if(w){b.innerHTML=`<i style="background:${COL[i%9]}"></i><b>${i+1}</b>`;b.onclick=()=>{sel=i;bar();msg('Cible : '+w.n)}}
  else b.disabled=true;
  el.appendChild(b)}
}

/* --- position --- */
function setPos(q,h){
 P=q;if(!ref||dist(q.lat,q.lon,ref.lat,ref.lon)>30000){ref={lat:Math.round(q.lat),lon:Math.round(q.lon)};G=new Map();CH=new Map();real=false;trail=[]}
 if(h!=null&&!isNaN(h)&&!hasCmp&&q.spd>.7)heading=h;
 const[ax,az]=abs(q.lat,q.lon),l=trail[trail.length-1];
 if(!l||Math.hypot(ax-l[0],az-l[1])>3){trail.push([ax,az]);if(trail.length>400)trail.shift()}
}
function startGPS(){
 if(!navigator.geolocation)return startDemo('GPS indisponible');
 demo=false;wps=wps.filter(w=>!w.demo);sel=0;trail=[];gc=null;real=false;G=new Map();CH=new Map();place='';route=null;listSteps();if(P&&P.demo)P=null;bar();$('#dpad').classList.remove('on');$('#bDemo').textContent='Mode démo';
 msg('Recherche du signal GPS…');
 if(watch!=null)navigator.geolocation.clearWatch(watch);
 watch=navigator.geolocation.watchPosition(p=>{if(demo)return;const c=p.coords;setPos({lat:c.latitude,lon:c.longitude,alt:c.altitude,acc:c.accuracy||0,spd:c.speed||0},c.heading);
  if(/Recherche|refus|perdu/.test($('#msg').textContent))msg('Signal GPS reçu.')},
  e=>startDemo(e.code===1?'Localisation bloquée ici (autorise-la, ou ouvre le GPS sur ton site HTTPS)':'Signal GPS perdu'),{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
}
function startDemo(why){
 if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null}
 demo=true;gc=null;real=false;G=new Map();CH=new Map();place='';route=null;listSteps();$('#dpad').classList.add('on');$('#bDemo').textContent='Vrai GPS';
 if(!P||!P.demo)setPos({lat:48.8566,lon:2.3522,alt:35,acc:0,spd:0,demo:1});
 P.demo=1;msg(why+'. Mode démo : flèches du clavier, WASD ou croix sur la carte.');bar();
}
function tick(){
 if(demo&&P){
  const dx=keys.r-keys.l,dz=keys.d-keys.u;
  if(dx||dz){const n=Math.hypot(dx,dz),st=1.6;
   P.lat-=dz/n*st/110574;P.lon+=dx/n*st/(111320*Math.cos(P.lat*R));
   heading=(Math.atan2(dx,-dz)/R+360)%360;P.spd=16;setPos(P)}
  else P.spd=0}
 info();chk();sync();
}

/* --- vraie carte OpenStreetMap (si le réseau l'autorise) --- */
const OSMC={road:['#7d7d7d','#707070'],path:['#b89a6a','#a88c5e'],bld:['#a65e3f','#9a553a'],water:['#3d6fd0','#4577d8'],park:['#4a8a2e','#53952f']},RAD=400;
let G=new Map(),gc=null,gcA=[0,0],real=false,busy=false,tryAt=0,place='',warned=false,CH=new Map(),ld=false;

function fill(p,k,put,X0,X1,Z0,Z1){

  const cz=(z+.5)*TM,xs=[];

['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{ptr.delete(e.pointerId);pd=0}));
cv.addEventListener('wheel',e=>{e.preventDefault();zi=Math.max(0,Math.min(4,zi+(e.deltaY<0?1:-1)))},{passive:false});
$('#rc').onclick=()=>{pan=[0,0];$('#rc').classList.remove('on')};
let tt=0;const toast=t=>{$('#toast').textContent=t;clearTimeout(tt);tt=setTimeout(()=>$('#toast').textContent='',2500)};
$('#bp').onclick=()=>{
 if(!P)return toast('Pas encore de position.');
 if(wps.length>=9)return toast('Barre pleine : 9 balises maximum.');
 const[ux,uz]=abs(P.lat,P.lon),vx=ux+pan[0],vz=uz+pan[1],n='Balise '+(wps.length+1);
 wps.push({n,lat:ref.lat-vz/110574,lon:ref.lon+vx/(111320*Math.cos(ref.lat*R))});sel=wps.length-1;save();bar();toast(n+' posée ('+wps.length+'/9)')};
function fit(){cv.width=Math.max(200,cv.clientWidth);cv.height=Math.max(200,cv.clientHeight);dirty=true}
function setFs(on){
 document.body.classList.toggle('fs',on);
 const b=$('#fsb');b.textContent=on?'✕':'▣';b.setAttribute('aria-label',on?'Quitter le plein écran':'Plein écran');
 try{const d=document.documentElement;
  if(on){if(d.requestFullscreen)d.requestFullscreen().catch(()=>{})}
  else if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
 scrollTo(0,0);fit();setTimeout(fit,120)}
$('#fsb').onclick=()=>setFs(!document.body.classList.contains('fs'));
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('fs'))setFs(false)});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('fs'))setFs(false)});
addEventListener('orientationchange',()=>setTimeout(fit,250));
cv.addEventListener('pointermove',()=>{if(ptr.size)dirty=true});
cv.addEventListener('wheel',()=>{dirty=true});
['#zi','#zo','#rc'].forEach(q=>$(q).addEventListener('click',()=>{dirty=true}));
addEventListener('resize',fit);fit();bar();setInterval(tick,100);startGPS();requestAnimationFrame(frame);
</script>
</body>
</html>
